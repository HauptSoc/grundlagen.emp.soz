<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>OLIW-Fragebogen</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body { font-family: "Atkinson Hyperlegible", system-ui, sans-serif; margin: 0; padding: 10px; background: #fff; font-size: 14px; }
  header, .typbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  input, select { font: inherit; padding: 5px 8px; border: 1px solid #889; border-radius: 6px; }
  button { font: inherit; padding: 5px 12px; border: 1px solid #456; border-radius: 6px; background: #D9E3E4; cursor: pointer; }
  button:hover:not(:disabled) { background: #c3d3d5; }
  button:disabled { opacity: 0.5; cursor: default; }
  button.small { padding: 1px 7px; font-size: 0.85em; }
  .hint { color: #666; font-size: 0.85em; }
  .typbar { padding: 8px; background: #f6f9fa; border: 1px solid #9ab; border-radius: 8px; }
  .typbar label { font-weight: bold; }

  table { border-collapse: collapse; width: 100%; margin-bottom: 16px; }
  th, td { border: 1px solid #ccd; padding: 8px 10px; vertical-align: middle; }
  th { background: #eef2f3; text-align: left; font-size: 0.9em; }
  th.scale { text-align: center; font-weight: normal; }
  td.itemnr { width: 3.2em; text-align: right; font-weight: bold; color: #567; font-size: 0.9em; }
  td.itemtext { font-size: 0.9em; line-height: 1.3; width: 62%; }
  td.answer { white-space: nowrap; text-align: center; }
  td.answer label { margin: 0 4px; cursor: pointer; font-size: 0.9em; color: #456; }
  td.answer input { accent-color: #4a7a8c; cursor: pointer; }
  tr.odd td { background: #fafbfc; }
</style>
</head>
<body>
<header>
  <input id="group" placeholder="Gruppenname" size="16">
  <button id="export">CSV exportieren</button>
  <button id="reset" class="small">Alle Typen löschen</button>
</header>

<div class="typbar">
  <label for="typeSelect">Typ:</label>
  <select id="typeSelect"></select>
  <button id="delType" class="small">Typ löschen</button>
  <span style="flex-basis: 100%; height: 0"></span>
  <label for="newType">Neuer Typ:</label>
  <input id="newType" placeholder="Name des Typs" size="24">
  <button id="addType" disabled>Typ anlegen</button>
</div>

<p id="progress" class="hint"></p>
<div id="table-wrap"></div>

<script src="items.js"></script>
<script>
const ITEMS = window.OLIW_ITEMS;
const DIM_KEYS = [...new Set(ITEMS.map((p) => p.dim))];
const SCALE = [1, 2, 3, 4, 5, 6, 7];
const $ = (id) => document.getElementById(id);
const storageKey = "oliw-fragebogen";

// state.types: [{id, name}]; state.answers: {typId: {item1: 1..7, ...}}
// state.indices (Hintergrundberechnung, nur für den Export): {typId: {dim: Summe}}
const emptyState = () => ({ group: "", types: [], answers: {}, indices: {}, active: null });
let state = load() || emptyState();

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(storageKey));
    if (!s) return null;
    return { ...emptyState(), ...s };
  } catch (e) { return null; }
}

// Additiver Index: bei invertierten Items 8 - Antwort (7-stufige Skala)
function indexFor(typId, dim) {
  const a = state.answers[typId] || {};
  const items = ITEMS.filter((p) => p.dim === dim);
  const vals = items.map((p) => a["item" + p.nr]);
  if (vals.some((v) => v == null)) return null;
  return items.reduce((sum, p, i) => sum + (p.reverse ? 8 - vals[i] : vals[i]), 0);
}

function save() {
  state.indices = Object.fromEntries(state.types.map((t) =>
    [t.id, Object.fromEntries(DIM_KEYS.map((d) => [d, indexFor(t.id, d)]))]));
  try { localStorage.setItem(storageKey, JSON.stringify(state)); } catch (e) {}
}

function render() {
  const sel = $("typeSelect");
  if (state.types.length) {
    sel.replaceChildren(...state.types.map((t) => new Option(t.name, t.id)));
    sel.value = state.active;
  } else {
    sel.replaceChildren(new Option("– noch kein Typ –", ""));
  }
  sel.disabled = !state.types.length;
  $("delType").disabled = !state.active;
  renderTable();
}

function renderTable() {
  const wrap = $("table-wrap");
  const t = state.types.find((o) => o.id === state.active);
  if (!t) {
    $("progress").textContent = "";
    const hint = document.createElement("p");
    hint.className = "hint";
    hint.textContent = "Legen Sie einen Typ an, um dessen Antworten zu erfassen.";
    wrap.replaceChildren(hint);
    return;
  }
  const a = state.answers[t.id] || (state.answers[t.id] = {});
  const updateProgress = () => {
    const n = ITEMS.filter((p) => a["item" + p.nr] != null).length;
    $("progress").textContent = `Typ „${t.name}“: ${n} von ${ITEMS.length} Items beantwortet`;
  };

  const table = document.createElement("table");
  table.innerHTML = `<thead><tr><th>Nr</th><th>Aussage</th>
    <th class="scale" colspan="7">1 = trifft überhaupt nicht zu … 7 = trifft völlig zu</th></tr></thead>`;
  const tbody = document.createElement("tbody");
  ITEMS.forEach((p, i) => {
    const tr = document.createElement("tr");
    if (i % 2) tr.className = "odd";
    const tdNr = document.createElement("td"); tdNr.className = "itemnr"; tdNr.textContent = p.nr;
    const tdTxt = document.createElement("td"); tdTxt.className = "itemtext"; tdTxt.textContent = p.text;
    tr.append(tdNr, tdTxt);
    SCALE.forEach((v) => {
      const td = document.createElement("td"); td.className = "answer";
      const label = document.createElement("label");
      const radio = document.createElement("input");
      radio.type = "radio"; radio.name = "item" + p.nr; radio.value = v;
      radio.checked = a["item" + p.nr] === v;
      radio.addEventListener("change", () => {
        a["item" + p.nr] = v; save(); updateProgress();
      });
      label.append(radio, document.createTextNode(v));
      td.append(label);
      tr.append(td);
    });
    tbody.append(tr);
  });
  table.append(tbody);
  wrap.replaceChildren(table);
  updateProgress();
}

// ---- Bedienelemente ----
$("newType").addEventListener("input", () => {
  $("addType").disabled = !$("newType").value.trim();
});
$("addType").addEventListener("click", () => {
  const name = $("newType").value.trim();
  if (!name) return;
  if (state.types.some((t) => t.name.toLowerCase() === name.toLowerCase())) {
    alert("Einen Typ mit diesem Namen gibt es bereits.");
    return;
  }
  const t = { id: "t" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), name };
  state.types.push(t);
  state.answers[t.id] = {};
  state.active = t.id;
  $("newType").value = "";
  $("addType").disabled = true;
  save(); render();
});
$("typeSelect").addEventListener("change", () => {
  state.active = $("typeSelect").value || null;
  save(); render();
});
$("delType").addEventListener("click", () => {
  const t = state.types.find((o) => o.id === state.active);
  if (!t || !confirm(`Typ „${t.name}“ samt Antworten löschen?`)) return;
  state.types = state.types.filter((o) => o.id !== t.id);
  delete state.answers[t.id];
  state.active = state.types[0]?.id ?? null;
  save(); render();
});
$("reset").addEventListener("click", () => {
  if (!confirm("Alle Typen und Antworten löschen?")) return;
  state = { ...emptyState(), group: state.group };
  save(); render();
});
$("group").value = state.group;
$("group").addEventListener("input", () => { state.group = $("group").value; save(); });

// ---- CSV-Export (Semikolon + BOM, damit deutsches Excel es direkt öffnet) ----
function exportCsv() {
  if (!state.types.length) { alert("Noch kein Typ angelegt."); return; }
  const header = ["gruppe", "typ", "item_nr", "antwort", ...DIM_KEYS.map((d) => "index_" + d)];
  const rows = [];
  state.types.forEach((t) => {
    const a = state.answers[t.id] || {};
    const idx = DIM_KEYS.map((d) => indexFor(t.id, d) ?? "");
    ITEMS.forEach((p) => rows.push([state.group, t.name, p.nr, a["item" + p.nr] ?? "", ...idx]));
  });
  const q = (v) => `"${String(v).replace(/"/g, '""')}"`;
  const csv = "\ufeff" + [header, ...rows].map((r) => r.map(q).join(";")).join("\r\n");
  const link = document.createElement("a");
  link.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  const g = (state.group || "gruppe").replace(/[^\wäöüÄÖÜß-]+/g, "_");
  link.download = `oliw_fragebogen_${g}.csv`;
  document.body.append(link); link.click(); link.remove();
}
$("export").addEventListener("click", exportCsv);

save();
render();
</script>
</body>
</html>
